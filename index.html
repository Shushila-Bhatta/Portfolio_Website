/* ===== Theme toggle: sun/moon, large and interactive on mobile ===== */
#theme{position:relative;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;transition:transform .15s}
#theme svg{grid-area:1/1;width:26px;height:26px;transition:opacity .35s,rotate .5s cubic-bezier(.34,1.56,.64,1),scale .5s cubic-bezier(.34,1.56,.64,1)}
#theme .sun{color:#E8A317;opacity:0;rotate:-90deg;scale:.4}
#theme .moon{color:var(--accent);opacity:1;rotate:0deg;scale:1}
:root[data-theme="dark"] #theme .sun{opacity:1;rotate:0deg;scale:1}
:root[data-theme="dark"] #theme .moon{opacity:0;rotate:90deg;scale:.4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #theme .sun{opacity:1;rotate:0deg;scale:1}:root:not([data-theme="light"]) #theme .moon{opacity:0;rotate:90deg;scale:.4}}
@keyframes ripple{from{transform:scale(.6);opacity:.9}to{transform:scale(1.35);opacity:0}}
@media (max-width:760px){
 nav{height:60px}html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
 #theme{width:46px;height:46px}#theme svg{width:28px;height:28px}
 #theme:active{transform:scale(.88)}
 #theme.pulse::before{content:"";position:absolute;inset:6px;border-radius:50%;background:color-mix(in srgb,var(--accent) 28%,transparent);animation:ripple .55s ease-out}
}
</style>
