#theme svg{grid-area:1/1;width:26px;height:26px;transition:opacity .35s,rotate .5s cubic-bezier(.34,1.56,.64,1),scale .5s cubic-bezier(.34,1.56,.64,1)}
#theme .sun{color:#E8A317;opacity:0;rotate:-90deg;scale:.4}
#theme .moon{color:var(--accent);opacity:1;rotate:0deg;scale:1}
:root[data-theme="dark"] #theme .sun{opacity:1;rotate:0deg;scale:1}
:root[data-theme="dark"] #theme .moon{opacity:0;rotate:90deg;scale:.4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #theme .sun{opacity:1;rotate:0deg;scale:1}:root:not([data-theme="light"]) #theme .moon{opacity:0;rotate:90deg;scale:.4}}
@keyframes ripple{from{transform:scale(.6);opacity:.9}to{transform:scale(1.35);opacity:0}}
@media (max-width:760px){
 nav{height:60px}html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
 #theme{width:46px;height:46px}#theme svg{width:28px;height:28px}
 #theme:active{transform:scale(.88)}
 #theme.pulse::before{content:"";position:absolute;inset:6px;border-radius:50%;background:color-mix(in srgb,var(--accent) 28%,transparent);animation:ripple .55s ease-out}
}

/* ---------- Crypto: password lock + authenticator (TOTP) ---------- */
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pk(pw,salt){const m=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},m,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function lockTxt(pw,t){const s=crypto.getRandomValues(new Uint8Array(16)),i=crypto.getRandomValues(new Uint8Array(12));return JSON.stringify({s:b64(s),i:b64(i),c:b64(await crypto.subtle.encrypt({name:"AES-GCM",iv:i},await pk(pw,s),enc.encode(t)))})}
async function unlockTxt(pw,blob){const o=JSON.parse(blob);return dec.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(o.i)},await pk(pw,ub(o.s)),ub(o.c)))}
const A="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
const b32=s=>{let b="";for(const c of s.replace(/[\s=]/g,"").toUpperCase()){const v=A.indexOf(c);if(v<0)return new Uint8Array(0);b+=v.toString(2).padStart(5,"0")}const o=[];for(let i=0;i+8<=b.length;i+=8)o.push(parseInt(b.slice(i,i+8),2));return new Uint8Array(o)};
const newSecret=()=>{let b="",s="";crypto.getRandomValues(new Uint8Array(20)).forEach(x=>b+=x.toString(2).padStart(8,"0"));for(let i=0;i<160;i+=5)s+=A[parseInt(b.slice(i,i+5),2)];return s};
async function totp(sec,t){const k=await crypto.subtle.importKey("raw",b32(sec),{name:"HMAC",hash:"SHA-1"},false,["sign"]),v=new DataView(new ArrayBuffer(8));v.setUint32(4,Math.floor(t/30000));
 const h=new Uint8Array(await crypto.subtle.sign("HMAC",k,v.buffer)),o=h[19]&15;return String(((h[o]&127)<<24|h[o+1]<<16|h[o+2]<<8|h[o+3])%1e6).padStart(6,"0")}
function normCode(c){c=String(c).replace(/\s/g,"");
 if(/^[A-Za-z2-7]{12,}$/.test(c))throw new Error("That is the long setup key, not the 6-digit code. Add the key to an authenticator app, then type the 6 digits the app shows.");
 if(!/^\d{6}$/.test(c))throw new Error("Enter the 6 digits shown in your authenticator app.");return c}
async function okCode(sec,code){code=normCode(code);for(const d of[-2,-1,0,1,2])if(await totp(sec,Date.now()+d*30000)===code)return true;return false}

async function hashPw(pw,salt){const m=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);return b64(await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:300000,hash:"SHA-256"},m,256))}

/* ---------- GitHub ---------- */
const KEY="portfolioEditor";

const H=t=>({Authorization:"Bearer "+t,Accept:"application/vnd.github+json"});
async function check(c,t){const r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}`,{headers:H(t)});
 if(!r.ok)throw new Error("GitHub rejected the token or repository ("+r.status+")");

 if(j.content)html=decodeURIComponent(escape(atob(j.content.replace(/\s/g,""))));
 else{const r=await fetch(u+q,{headers:{...H(TOK),Accept:"application/vnd.github.raw+json"}});html=await r.text()}

 if(!r.ok)throw new Error((await r.json()).message||"Save failed ("+r.status+")")}
const reD=/\/\*DATA\*\/[\s\S]*?\/\*END\*\//,reA=/\/\*AUTH\*\/[\s\S]*?\/\*AUTHEND\*\//;
const saveGH=snap=>commitHtml(h=>{if(!reD.test(h))throw new Error("index.html in the repository has no data markers");const d=snap.replace(/</g,"\\u003c");return h.replace(reD,()=>"/*DATA*/"+d+"/*END*/")});
