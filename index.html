<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shushila Bhatta | Computer Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8EDF5;--surface:#F7F9FC;--ink:#14213D;--muted:#4A5878;--line:#C5CFE0;--accent:#2F5BFF;--accent-ink:#fff;--amber:#FFB020;
--head:'Bricolage Grotesque','Trebuchet MS',sans-serif;--body:'DM Sans',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1730;--surface:#18234A;--ink:#EAF0FF;--muted:#A5B3D6;--line:#2B3A6B;--accent:#7C9BFF;--accent-ink:#0F1730}}
:root[data-theme="dark"]{--bg:#0F1730;--surface:#18234A;--ink:#EAF0FF;--muted:#A5B3D6;--line:#2B3A6B;--accent:#7C9BFF;--accent-ink:#0F1730}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--body)}
a{color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;gap:6px;height:60px;overflow-x:auto}
nav .logo{font:800 20px var(--head);margin-right:auto;text-decoration:none;white-space:nowrap}
nav a.l{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap}
nav a.l:hover{background:var(--surface);color:var(--ink)}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;width:38px;height:38px;cursor:pointer;font-size:17px}
section{padding:72px 0 8px}
h1,h2,h3{font-family:var(--head);line-height:1.08;margin:0}
h1{font-size:clamp(40px,7vw,72px);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(28px,4vw,40px);font-weight:700;margin-bottom:22px;letter-spacing:-.01em}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center;padding-top:56px}
.role{font:500 20px var(--head);color:var(--accent);min-height:30px;margin:14px 0}
.cursor{display:inline-block;width:2px;height:1em;background:var(--accent);margin-left:2px;vertical-align:-2px;animation:b 1s steps(2) infinite}
@keyframes b{50%{opacity:0}}
.hero p{max-width:52ch;color:var(--muted)}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.btn{display:inline-block;padding:12px 22px;border-radius:10px;font-weight:700;text-decoration:none;border:2px solid var(--accent);transition:transform .15s}
.btn.p{background:var(--accent);color:var(--accent-ink)}
.btn:hover{transform:translateY(-2px)}
.photo{justify-self:center;perspective:700px;text-align:center}
.frame{width:min(300px,70vw);aspect-ratio:1;border-radius:50%;border:5px solid var(--surface);background:var(--surface);overflow:hidden;display:grid;place-items:center;position:relative;transition:transform .15s;outline:2px solid var(--accent);outline-offset:7px;box-shadow:0 22px 44px rgba(20,33,61,.22)}
.frame img{width:100%;height:100%;object-fit:cover;display:none}
.frame .ini{font:800 96px var(--head);color:var(--accent)}
.frame.has img{display:block}.frame.has .ini{display:none}
.photo small{display:block;margin-top:22px;color:var(--muted);font-size:14px}
.tl{list-style:none;margin:0;padding:0 0 0 34px;position:relative}
.tl::before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:3px;background:var(--line);border-radius:2px}
.tl li{position:relative;margin-bottom:22px}
.tl li::before{content:"";position:absolute;left:-30px;top:26px;width:15px;height:15px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.tl li.now::before{background:var(--amber)}
.tcard{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.logo-b{flex:none;width:64px;height:64px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--accent);font:800 20px var(--head);display:grid;place-items:center;cursor:pointer;overflow:hidden;padding:0}
.logo-b img{width:100%;height:100%;object-fit:contain;background:#fff}
.tcard b{font:700 19px var(--head);display:block}
.yrs{display:inline-block;font-weight:700;font-size:14px;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:1px 10px;margin-bottom:6px}
.tcard .sub{color:var(--muted);font-size:15px;line-height:1.45}
.tl-hint{color:var(--muted);font-size:14px;margin:0 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:999px;font:700 15px var(--body);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px;margin-top:26px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
.card.hide{display:none}
.card h3{font-size:21px}
.card p{margin:0;color:var(--muted);font-size:16px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.tags span{font-size:13px;font-weight:700;padding:3px 10px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.tags span.on{background:var(--amber);border-color:var(--amber);color:#14213D}
.links{display:flex;gap:10px}
.links a{font-weight:700;font-size:15px;padding:8px 14px;border-radius:8px;text-decoration:none;border:2px solid var(--accent)}
.links a:first-child{background:var(--accent);color:var(--accent-ink)}
.contact{display:flex;flex-wrap:wrap;gap:16px}
.contact a{width:64px;height:64px;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);border-radius:16px;color:var(--ink);transition:transform .15s,background .15s,color .15s,border-color .15s}
.contact a:hover{transform:translateY(-4px);background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.contact svg{width:28px;height:28px;fill:currentColor}
footer{user-select:none;-webkit-user-select:none;padding:48px 0 40px;color:var(--muted);font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;font-weight:500}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:760px){body{font-size:16px}.wrap{padding:0 16px}section{padding-top:52px}.btns .btn{flex:1;text-align:center}.tcard{padding:14px}.logo-b{width:52px;height:52px;font-size:16px}.contact a{width:calc(33.333% - 11px);height:60px}.hero{grid-template-columns:1fr}.photo{order:-1}nav a.l.x{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

#ed{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
#ed[hidden]{display:none}
.ep{max-width:720px;margin:0 auto}
.ep h2{margin:0 0 6px}.ep p{color:var(--muted);margin:6px 0 14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
.bar h2{margin:0 auto 0 0;font-size:24px}
.eb{border:2px solid var(--accent);background:transparent;color:var(--ink);padding:9px 16px;border-radius:10px;font:700 15px var(--body);cursor:pointer;margin:4px 8px 4px 0}
.eb.p{background:var(--accent);color:var(--accent-ink)}.eb.d{border-color:#d33;color:#d33}
.ep fieldset{border:1px solid var(--line);border-radius:14px;margin:0 0 18px;padding:14px;background:var(--surface)}
.ep legend{font:700 18px var(--head);padding:0 8px}
.fl{display:block;margin:0 0 12px}.fl span{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:4px}
.fl input,.fl textarea{width:100%;font:16px var(--body);padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.fl textarea{min-height:80px;resize:vertical}
.item{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.ck{display:block;margin:0 0 10px}
#st{font-weight:700;min-height:24px}.ok{color:#1a8a4a}.er{color:#d33}
.key{font:700 18px monospace;word-break:break-all;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.thumb{width:84px;height:84px;border-radius:14px;border:2px solid var(--line);background:#fff;display:grid;place-items:center;overflow:hidden;font-size:13px;font-weight:700;color:#4A5878;margin:0 0 10px;text-align:center}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb.rnd{width:116px;height:116px;border-radius:50%}.thumb.rnd img{object-fit:cover}
.rev{list-style:none;margin:0 0 12px;padding:0}.rev li{padding:8px 0;border-top:1px dashed var(--line);font-size:15px;overflow-wrap:anywhere}
.rev code{background:var(--bg);padding:1px 6px;border-radius:6px;font-size:13px}.rev div{color:var(--muted);margin-top:2px}
.pw{width:fit-content;margin:0 0 12px}.pw .thumb{margin:0}.pw:not(.rnd) .thumb{width:96px;height:96px}
.pbar{display:flex;gap:8px;margin-top:8px}
.pbar .eb{margin:0;padding:5px 12px;font-size:14px;border-radius:8px}
[hidden]{display:none!important}
.count{font:700 16px var(--body);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 12px;vertical-align:middle;margin-left:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font:800 28px var(--head);color:var(--accent)}.stat span{font-size:13px;color:var(--muted)}
</style>
</head>

const newSecret=()=>{let b="",s="";crypto.getRandomValues(new Uint8Array(20)).forEach(x=>b+=x.toString(2).padStart(8,"0"));for(let i=0;i<160;i+=5)s+=A[parseInt(b.slice(i,i+5),2)];return s};

 const h=new Uint8Array(await crypto.subtle.sign("HMAC",k,v.buffer)),o=h[19]&15;return String(((h[o]&127)<<24|h[o+1]<<16|h[o+2]<<8|h[o+3])%1e6).padStart(6,"0")}

/* ---------- GitHub ---------- */
const KEY="portfolioEditor";
const store=()=>{try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}};
const put=o=>{try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){toast("Browser storage is blocked")}};
function guess(){const h=location.hostname,p=location.pathname.split("/")[1];return h.endsWith(".github.io")?{owner:h.split(".")[0],repo:p&&!p.includes(".")?p:h,branch:"main"}:{owner:"",repo:"",branch:"main"}}
const H=t=>({Authorization:"Bearer "+t,Accept:"application/vnd.github+json"});
async function check(c,t){const r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}`,{headers:H(t)});
 if(!r.ok)throw new Error("GitHub rejected the token or repository ("+r.status+")");
 const j=await r.json();if(j.permissions&&!j.permissions.push)throw new Error("This token cannot write to the repository")}
async function saveGH(snap){const c=store().cfg,u=`https://api.github.com/repos/${c.owner}/${c.repo}/contents/index.html`,q="?ref="+encodeURIComponent(c.branch);
 const g=await fetch(u+q,{headers:H(TOK)});if(!g.ok)throw new Error("Could not read index.html in the repository ("+g.status+")");
 const j=await g.json();let html;
 if(j.content)html=decodeURIComponent(escape(atob(j.content.replace(/\s/g,""))));
 else{const r=await fetch(u+q,{headers:{...H(TOK),Accept:"application/vnd.github.raw+json"}});html=await r.text()}
 const data=snap.replace(/</g,"\\u003c");
 if(!/\/\*DATA\*\/[\s\S]*?\/\*END\*\//.test(html))throw new Error("index.html in the repository has no data markers");
 html=html.replace(/\/\*DATA\*\/[\s\S]*?\/\*END\*\//,()=>"/*DATA*/"+data+"/*END*/");
 const bin=unescape(encodeURIComponent(html));let b="";for(let i=0;i<bin.length;i+=8192)b+=String.fromCharCode.apply(null,[...bin.slice(i,i+8192)].map(x=>x.charCodeAt(0)));
 const r=await fetch(u,{method:"PUT",headers:{...H(TOK),"Content-Type":"application/json"},body:JSON.stringify({message:"Update portfolio content",content:btoa(b),sha:j.sha,branch:c.branch})});
 if(!r.ok)throw new Error((await r.json()).message||"Save failed ("+r.status+")")}

const row=(p,lab,val,fn,o={})=>{const l=el("label","fl");l.append(el("span","",lab));const i=el(o.ta?"textarea":"input");if(o.type)i.type=o.type;i.value=val||"";
 if(fn)i.oninput=()=>{fn(i.value);render()};l.append(i);p.append(l);return i};
function pick(max,type,cb){const f=document.createElement("input");f.type="file";f.accept="image/*";
 f.onchange=()=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
  c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL(type,.85))};im.src=r.result};r.readAsDataURL(f.files[0])};f.click()}

const stats=()=>{const d=el("div","stats");[["Projects",DATA.projects.length],["Skills",DATA.skills.length],["Education",DATA.education.length]].forEach(([k,v])=>{const t=el("div","stat");t.append(el("b","",String(v)),el("span","",k));d.append(t)});return d};

function preview(parent,get,txt,round,change,remove,noun){const w=el("div","pw"+(round?" rnd":""));let t=thumb(get(),txt,round);const bar=el("div","pbar");w.append(t,bar);parent.append(w);

function flat(o,p,out){if(o&&typeof o==="object")Object.keys(o).forEach(k=>flat(o[k],p?p+(Array.isArray(o)?"["+k+"]":"."+k):k,out));else out[p]=o;return out}
const show=v=>typeof v==="string"&&v.startsWith("data:")?(v.startsWith("data:image")?"(image)":"(file)"):v==null||v===""?"(empty)":String(v).length>70?String(v).slice(0,70)+"…":String(v);
function changes(){const a=flat(BASE,"",{}),b=flat(DATA,"",{}),out=[];
 new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{if(a[k]===b[k])return;
  if(!(k in a))out.push(["Added",k,show(b[k])]);else if(!(k in b))out.push(["Removed",k,show(a[k])]);else out.push(["Changed",k,show(a[k])+" → "+show(b[k])])});return out}
function showReview(conf){const c=changes();revBox.innerHTML="";const f=el("fieldset");f.append(el("legend","",c.length?"Changes to save ("+c.length+")":"No changes"));

function viewSetup(){const b=body(),f=el("fieldset");head(b,"Create your editor password","Choose a password to open this editor. Your GitHub token is only asked for when you save.");

  const sec=newSecret();put({chk:await lockTxt(pw.value,"ok"),sec,cfg:guess()});PW=pw.value;viewKey(sec,true)}catch(e){status(e.message,1)}};
 pw.onkeydown=e=>{if(e.key==="Enter")go()};
 wrapBtns(b,btn("Continue",go,"p"),btn("Close",closeEd))}

 b.append(el("div","key",sec));const a=el("a","",  "Open in authenticator app");a.href="otpauth://totp/Portfolio%20Editor?secret="+sec+"&issuer=Portfolio";a.style.display="block";a.style.margin="12px 0";b.append(a);

function viewLock(){const b=body();head(b,"Editor locked","Enter your password to continue.");const f=el("fieldset"),pw=row(f,"Password","",null,{type:"password"});b.append(f);

function viewReset(){const b=body();head(b,"Reset password","Enter the 6-digit code from your authenticator app and choose a new password.");const f=el("fieldset"),
 c=row(f,"6-digit code",""),pw=row(f,"New password (8+ characters)","",null,{type:"password"});c.inputMode="numeric";b.append(f);
 wrapBtns(b,btn("Reset password",async()=>{try{const s=store();
  if(pw.value.length<8)throw new Error("Use a password of at least 8 characters");
  if(!await okCode(s.sec,c.value))throw new Error("That code is not correct");
  s.chk=await lockTxt(pw.value,"ok");delete s.tok;put(s);PW=pw.value;viewEdit();setTimeout(()=>status("Password changed. Enter your GitHub token when you save."),0)}catch(e){status(e.message,1)}},"p"),btn("Back",viewLock))}

async function doSave(auto){if(saving)return;try{const s=store();let t=tokIn.value.trim();
 if(!s.cfg.owner||!s.cfg.repo)throw new Error("Open Repository details above and enter the owner and repository name");
 if(!t&&s.tok){try{t=await unlockTxt(PW,s.tok)}catch(e){}}
 if(!t)throw new Error("Enter your GitHub token above to save");
 saving=true;const snap=JSON.stringify(DATA);TOK=t;status(auto===true?"Auto-saving…":"Saving…");await saveGH(snap);
 if(remember.checked&&tokIn.value.trim()){s.tok=await lockTxt(PW,t);put(s)}
 BASE=JSON.parse(snap);if(JSON.stringify(DATA)===snap)try{localStorage.removeItem(DK)}catch(e){}
 revBox.innerHTML="";status((auto===true?"Auto-saved":"Saved")+" at "+hm()+". The live site updates in about a minute.")}catch(e){status(e.message,1)}finally{saving=false}}

function viewEdit(){let rmsg=false;if(!restored){restored=true;let dr=null;try{dr=JSON.parse(localStorage.getItem(DK))}catch(e){}
 if(dr&&dr.name&&JSON.stringify(dr)!==JSON.stringify(BASE)){DATA=dr;render();rmsg=true}}
 const b=body(),s=store(),y=window.scrollY;if(!s.cfg||!s.cfg.owner||!s.cfg.repo){s.cfg=Object.assign(s.cfg||{},guess());put(s)}
 const bar=el("div","bar");bar.append(el("h2","","Portfolio editor"),btn("Save to GitHub",()=>showReview(true),"p"),btn("Lock and close",()=>{clearTimeout(at);saveDraft();TOK=PW=null;closeEd()}));b.append(bar);
 const st=el("p");st.id="st";b.append(st);const as=el("p");as.id="as";as.style.cssText="font-size:14px;color:var(--muted);margin:0 0 12px";b.append(as);revBox=el("div");b.append(revBox);
 const grp=t=>{const f=el("fieldset");f.append(el("legend","",t));b.append(f);return f};
 const dsh=grp("Dashboard");dsh.append(stats());
 let f=grp("Publish to GitHub");tokIn=row(f,"GitHub token (only needed to save)","",null,{type:"password"});tokIn.placeholder=s.tok?"Saved token will be used":"Paste your token";
 const rl=el("label","ck"),rm=el("input");rm.type="checkbox";remember=rm;rl.append(rm," Remember it on this device (encrypted with your password)");f.append(rl);
 const al=el("label","ck"),ac=el("input");ac.type="checkbox";ac.checked=!!s.cfg.auto;ac.onchange=()=>{s.cfg.auto=ac.checked;put(s);if(ac.checked)queueAuto()};al.append(ac," Auto-save to GitHub 5 seconds after I stop editing (skips the review step)");f.append(al);
 const dt=el("details"),sm=el("summary","",s.cfg.owner&&s.cfg.repo?"Repository: "+s.cfg.owner+"/"+s.cfg.repo+" ("+s.cfg.branch+")":"Repository details (needed once)");sm.style.cursor="pointer";sm.style.margin="8px 0";dt.append(sm);if(!s.cfg.owner||!s.cfg.repo)dt.open=true;
 row(dt,"Owner",s.cfg.owner,v=>{s.cfg.owner=v.trim();put(s)});row(dt,"Repository",s.cfg.repo,v=>{s.cfg.repo=v.trim();put(s)});row(dt,"Branch",s.cfg.branch,v=>{s.cfg.branch=v.trim()||"main";put(s)});f.append(dt);
 if(s.tok)wrapBtns(f,btn("Forget saved token",()=>{delete s.tok;put(s);viewEdit()}));
 f=grp("Profile");const upP=preview(f,()=>DATA.photo,"No photo",1,()=>pick(480,"image/jpeg",u=>{DATA.photo=u;render();upP()}),()=>{DATA.photo="";render();upP()},"photo");row(f,"Name",DATA.name,v=>DATA.name=v);row(f,"About",DATA.about,v=>DATA.about=v,{ta:1});
 row(f,"Typing roles (one per line)",DATA.roles.join("\n"),v=>DATA.roles=v.split("\n").map(x=>x.trim()).filter(Boolean),{ta:1});
 
 f=grp("Skills");row(f,"Skills (comma separated)",DATA.skills.join(", "),v=>DATA.skills=v.split(",").map(x=>x.trim()).filter(Boolean));
 f=grp("Education (newest first)");

  const l=el("label","ck"),cb=el("input");cb.type="checkbox";cb.checked=!!e.now;cb.onchange=()=>{e.now=cb.checked;render()};l.append(cb," Current");w.append(l);
  wrapBtns(w,btn("Delete entry",()=>{DATA.education.splice(i,1);render();viewEdit()},"d"));f.append(w)});

  wrapBtns(w,btn("Delete project",()=>{DATA.projects.splice(i,1);render();viewEdit()},"d"));f.append(w)});

 f=grp("Contact");const C=DATA.contact;row(f,"GitHub URL",C.github,v=>C.github=v);row(f,"LinkedIn URL",C.linkedin,v=>C.linkedin=v);row(f,"Gmail address",C.email,v=>C.email=v);row(f,"WhatsApp number (country code, digits only)",C.whatsapp,v=>C.whatsapp=v);

 f=grp("Password and security");
 const ek=row(f,"Use an existing authenticator key (optional)","");const np=row(f,"New password (8+ characters)","",null,{type:"password"});
